name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # 推送 vX.X.X 格式的 tag 时触发
  workflow_dispatch:  # 手动试打包 macOS ARM64，不创建 Release

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Verify example ZIP
        run: node -e "const fs=require('fs');const z=fs.readdirSync('example_drama').filter(f=>f.endsWith('.zip'));if(!z.length||z.some(f=>fs.statSync('example_drama/'+f).size<1024))throw Error('Example ZIP not fetched from Git LFS')"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Build frontend
        working-directory: frontweb
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend-node
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm ci

      - name: Install desktop dependencies & rebuild native modules
        working-directory: desktop
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm ci

      - name: Copy frontend dist
        working-directory: desktop
        run: node scripts/copy-front.js

      - name: Copy backend
        working-directory: desktop
        run: node scripts/copy-backend.js

      # 标准版（含示例数据）
      - name: Build Standard Installer
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - name: Upload Standard Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  build-macos-arm64:
    name: Build macOS ARM64 DMGs
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          architecture: arm64
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Check Node architecture
        run: test "$(node -p process.arch)" = arm64

      - name: Verify example ZIP
        run: node -e "const fs=require('fs');const z=fs.readdirSync('example_drama').filter(f=>f.endsWith('.zip'));if(!z.length||z.some(f=>fs.statSync('example_drama/'+f).size<1024))throw Error('Example ZIP not fetched from Git LFS')"

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Install desktop dependencies and rebuild ARM64 native modules
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder install-app-deps --arch=arm64
          lipo -verify_arch arm64 node_modules/better-sqlite3/build/Release/better_sqlite3.node

      - name: Build frontend and copy assets
        working-directory: desktop
        run: |
          npm run build:front
          npm run copy-front
          npm run prepare-backend

      - name: Build ARM64 DMGs (standard and lite)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --arm64 --config electron-builder-mac.json --publish never
          npx electron-builder --mac --arm64 --config electron-builder-mac-lite.json --publish never

      - name: Verify DMG native modules are ARM64
        working-directory: desktop
        run: |
          for dmg in release/*-mac-arm64.dmg; do
            mount="$(mktemp -d)"
            hdiutil attach -quiet -readonly -nobrowse -mountpoint "$mount" "$dmg"
            found=0
            while IFS= read -r -d '' addon; do
              echo "Checking $addon"
              lipo -verify_arch arm64 "$addon"
              found=1
            done < <(find "$mount" -type f -name '*.node' -print0)
            test "$found" = 1
            hdiutil detach -quiet "$mount"
            rmdir "$mount"
          done

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: desktop/release/*-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos-arm64]
    if: ${{ always() && github.event_name == 'push' && needs.build-macos-arm64.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-release
          path: release

      - name: Download Windows installers (if built)
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
