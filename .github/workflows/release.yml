name: Release

on:
  push:
    tags:
      - 'v*.*.*'   # 推送 vX.X.X 格式的 tag 时触发
  workflow_dispatch:  # 手动试打包 macOS ARM64，不创建 Release

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Build frontend
        working-directory: frontweb
        run: npm run build

      - name: Install backend dependencies
        working-directory: backend-node
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm ci

      - name: Install desktop dependencies & rebuild native modules
        working-directory: desktop
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm ci

      - name: Copy frontend dist
        working-directory: desktop
        run: node scripts/copy-front.js

      - name: Copy backend
        working-directory: desktop
        run: node scripts/copy-backend.js

      # 标准版（含示例数据）
      - name: Build Standard Installer
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload Standard Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: desktop/release/*.exe
          retention-days: 7

  build-macos-arm64:
    name: Build macOS ARM64 DMGs
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontweb
        run: npm ci

      - name: Install desktop dependencies and rebuild native modules
        working-directory: desktop
        run: npm ci

      - name: Build frontend and copy assets
        working-directory: desktop
        run: |
          npm run build:front
          npm run copy-front
          npm run prepare-backend

      - name: Build ARM64 DMGs (standard and lite)
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npx electron-builder --mac --arm64 --config electron-builder-mac.json --publish never
          npx electron-builder --mac --arm64 --config electron-builder-mac-lite.json --publish never

      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release
          path: desktop/release/*-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create GitHub Release
    needs: [build-windows, build-macos-arm64]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: release
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true   # 先创建草稿，人工审核后手动发布
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
